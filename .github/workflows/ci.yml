name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - run: uv sync --locked

      - run: uv run ruff format . --check
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run python -m pytest tests --ignore=tests/e2e/
      # 個人用ツールのため、 E2EテストはGitHub Actionsでは実行しない
      # - run: uv run python -m pytest tests/e2e
      #   env:
      #     CODMON_EMAIL: ${{ secrets.CODMON_EMAIL }}
      #     CODMON_PASSWORD: ${{ secrets.CODMON_PASSWORD }}
      #     PIYOLOG_FEED_URL: ${{ secrets.PIYOLOG_FEED_URL }}
