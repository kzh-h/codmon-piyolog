steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/codmon-piyolog:$BUILD_ID', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/codmon-piyolog:$BUILD_ID']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - 'codmon-piyolog'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/codmon-piyolog:$BUILD_ID'
      - '--region'
      - '${_REGION}'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '1'
      - '--task-timeout'
      - '300s'
      - '--max-retries'
      - '0'
      - '--set-secrets'
      - 'CODMON_EMAIL=codmon-email:latest,CODMON_PASSWORD=codmon-password:latest,PIYOLOG_FEED_URL=piyolog-feed-url:latest,GAS_URL=gas-url:latest,GAS_KEY=gas-key:latest'
      - '--set-env-vars'
      - 'HEADLESS=true,GCS_TRACE_BUCKET=${_TRACE_BUCKET},ENVIRONMENT=gcp'

options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _REGION: 'asia-northeast1'
  _REPOSITORY: 'codmon-piyolog'
  _TRACE_BUCKET: 'codmon-piyolog-traces-codmon-piyologa-auto'