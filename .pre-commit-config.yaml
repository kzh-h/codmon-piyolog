repos:

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args:
          - --fix

      - id: ruff-format

  - repo: local
    hooks:

      - id: mypy
        name: mypy
        entry: uv run mypy src
        language: system
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: uv run python -m pytest tests
        language: system
        pass_filenames: false

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: '\.env\.sample$'